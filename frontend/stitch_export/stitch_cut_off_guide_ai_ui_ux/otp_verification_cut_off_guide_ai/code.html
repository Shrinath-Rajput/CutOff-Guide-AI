<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('#otp-container input');
            const verifyBtn = document.getElementById('verify-btn');
            
            // Auto-focus logic
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Ensure only numbers are entered
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    if (e.target.value.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                    checkFormComplete();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '') {
                        if (index > 0) {
                            inputs[index - 1].focus();
                        }
                    }
                });
                
                // Allow paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/[^0-9]/g, '');
                    if (pastedData) {
                        for (let i = 0; i < pastedData.length; i++) {
                            if (inputs[i]) {
                                inputs[i].value = pastedData[i];
                            }
                        }
                        const focusIndex = Math.min(pastedData.length, inputs.length - 1);
                        inputs[focusIndex].focus();
                        checkFormComplete();
                    }
                });
            });

            function checkFormComplete() {
                const allFilled = Array.from(inputs).every(input => input.value.length === 1);
                if (allFilled) {
                    verifyBtn.classList.add('animate-[pulse_1.5s_ease-in-out_infinite]');
                } else {
                    verifyBtn.classList.remove('animate-[pulse_1.5s_ease-in-out_infinite]');
                }
            }

            // Timer Logic
            let timeLeft = 30;
            const timerCount = document.getElementById('timer-count');
            const timerText = document.getElementById('timer-text');
            const resendBtn = document.getElementById('resend-btn');

            const countdown = setInterval(() => {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerCount.textContent = `00:${seconds}`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerCount.classList.add('hidden');
                    timerText.classList.add('hidden');
                    resendBtn.classList.remove('hidden');
                    resendBtn.classList.add('animate-[fadeIn_0.3s_ease-out]');
                }
            }, 1000);
            
            // Resend simulate
            resendBtn.addEventListener('click', (e) => {
                e.preventDefault();
                // Reset visual state
                inputs.forEach(i => i.value = '');
                inputs[0].focus();
                
                // Reset timer visuals (mock functionality)
                resendBtn.classList.add('hidden');
                timerCount.classList.remove('hidden');
                timerText.classList.remove('hidden');
                timerCount.textContent = `00:30`;
                // In real implementation, restart interval here
            });
        });

        function verifyOTP() {
            const btn = document.getElementById('verify-btn');
            const originalContent = btn.innerHTML;
            
            // Loading state
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span><span>Verifying...</span>';
            btn.disabled = true;
            
            // Simulate API call
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>Success</span>';
                btn.classList.replace('bg-primary-container', 'bg-[#1e8e3e]'); // arbitrary green for success state temp
                
                // Reset or redirect
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.classList.replace('bg-[#1e8e3e]', 'bg-primary-container');
                }, 2000);
            }, 1500);
        }
    </script>
