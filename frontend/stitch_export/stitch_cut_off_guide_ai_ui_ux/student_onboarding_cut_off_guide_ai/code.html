        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6, .display-font { font-family: 'Hanken Grotesk', sans-serif; }

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface/80 backdrop-blur-md fixed top-0 w-full z-50 border-b border-outline-variant/30 shadow-sm flex justify-between items-center px-gutter h-16 w-full">
<div class="flex items-center gap-4">
<span aria-label="Menu" class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:bg-surface-container-low transition-colors duration-200 rounded-full p-2">menu</span>
<span class="text-headline-md font-headline-md font-bold text-primary">Cut-Off Guide AI</span>
</div>
<div>
<span aria-label="Search" class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:bg-surface-container-low transition-colors duration-200 rounded-full p-2">search</span>
</div>
</header>
<!-- Main Content Canvas (Navigation Suppressed for Onboarding) -->
<main class="flex-grow flex items-center justify-center pt-24 pb-16 px-gutter md:px-section-padding">
<div class="w-full max-w-3xl bg-surface-container-lowest rounded-xl shadow-[0_4px_12px_rgba(20,33,61,0.03)] border border-outline-variant/20 overflow-hidden flex flex-col">
<!-- Progress Indicator -->
<div class="bg-surface-container-low p-6 border-b border-outline-variant/20">
<div class="flex items-center justify-between relative">
<!-- Progress Line Background -->
<div class="absolute top-1/2 left-0 w-full h-1 bg-outline-variant/30 -z-10 -translate-y-1/2 rounded-full"></div>
<!-- Progress Line Active -->
<div class="absolute top-1/2 left-0 w-[25%] h-1 bg-primary-container -z-10 -translate-y-1/2 rounded-full transition-all duration-500"></div>
<!-- Step 1 (Active) -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary flex items-center justify-center font-bold text-sm shadow-sm ring-4 ring-surface-container-lowest">
                            1
                        </div>
<span class="text-label-sm font-label-sm text-primary">Personal</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-bold text-sm shadow-sm ring-4 ring-surface-container-lowest">
                            2
                        </div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Academic</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-bold text-sm shadow-sm ring-4 ring-surface-container-lowest">
                            3
                        </div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Preferences</span>
</div>
<!-- Step 4 -->
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-bold text-sm shadow-sm ring-4 ring-surface-container-lowest">
                            4
                        </div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Prediction</span>
</div>
</div>
</div>
<!-- Form Content -->
<div class="p-8 md:p-12">
<div class="mb-8">
<h2 class="text-headline-md font-headline-md text-on-background mb-2">Personal Information</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Let's start with the basics to build your academic profile.</p>
</div>
<form class="space-y-6">
<div>
<label class="block text-label-sm font-label-sm text-on-background mb-1" for="fullName">Full Name</label>
<input class="w-full h-[56px] rounded-DEFAULT border border-outline bg-surface-bright px-4 text-body-md font-body-md focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors" id="fullName" placeholder="e.g. Alex Morgan" type="text"/>
</div>
<div>
<label class="block text-label-sm font-label-sm text-on-background mb-1" for="email">Email Address</label>
<input class="w-full h-[56px] rounded-DEFAULT border border-outline bg-surface-bright px-4 text-body-md font-body-md focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors" id="email" placeholder="alex.morgan@example.com" type="email"/>
</div>
<div>
<label class="block text-label-sm font-label-sm text-on-background mb-1" for="phone">Phone Number</label>
<input class="w-full h-[56px] rounded-DEFAULT border border-outline bg-surface-bright px-4 text-body-md font-body-md focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</form>
</div>
<!-- Navigation Actions -->
<div class="bg-surface-container-low p-6 border-t border-outline-variant/20 flex justify-between items-center">
<button class="px-6 py-3 rounded-DEFAULT border border-outline text-on-background font-label-sm text-label-sm hover:bg-surface-variant transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                    Back
                </button>
<button class="px-8 py-3 rounded-DEFAULT bg-primary-container text-on-primary font-label-sm text-label-sm hover:bg-primary transition-colors flex items-center gap-2 shadow-[0_4px_12px_rgba(20,33,61,0.06)]">
                    Continue
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>

<footer class="bg-surface-container-lowest w-full py-10 px-gutter border-t border-outline-variant/20 flex flex-col items-center gap-stack-gap text-center">
